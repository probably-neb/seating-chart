<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width" />
        <title>Deskribe Seating Chart Editor</title>
        <link rel="stylesheet" href="/styles.css" />
        <script type="module" src="/main.js"></script>
    </head>
    <body>
        <div id="app" class="app">
            <header id="top-bar" class="app-header">
                <div class="toolbar" role="toolbar" aria-label="Chart tools">
                    <button id="add-seat-button" class="btn btn-primary" data-tip="Or ctrl + click anywhere on the chart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        Add seat
                    </button>
                    <button class="btn btn-quiet btn-icon" disabled aria-label="Move" data-tip="Move tool, coming soon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
                    </button>
                    <button class="btn btn-quiet btn-icon" disabled aria-label="Eraser" data-tip="Eraser, coming soon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21M22 21H7M5 11l9 9"/></svg>
                    </button>

                    <span class="tool-sep"></span>

                    <button id="undo-button" class="btn btn-quiet btn-icon" aria-label="Undo" data-tip="Undo (ctrl + z)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                    </button>
                    <button id="redo-button" class="btn btn-quiet btn-icon" aria-label="Redo" data-tip="Redo (ctrl + y)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
                    </button>

                    <span class="tool-sep"></span>

                    <button id="save-button" class="btn" data-tip="Autosaves every 30s">Save</button>
                </div>
            </header>

            <aside id="sidebar" class="sidebar">
                <a class="brand" href="/">
                    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="11" height="11" rx="3" fill="var(--logo-1)"/><rect x="14" y="1" width="11" height="11" rx="3" fill="var(--logo-2)"/><rect x="1" y="14" width="11" height="11" rx="3" fill="var(--logo-3)"/><rect x="14" y="14" width="11" height="11" rx="5.5" fill="var(--logo-4)"/></svg>
                    <span>Deskribe<small>All charts</small></span>
                </a>

                <div class="sidebar-head">
                    <h2>Students</h2>
                    <span id="student-count" class="count"></span>
                </div>

                <form id="add-student-form" class="add-student">
                    <input id="student-name-input" type="text" placeholder="Add a student" autocomplete="off" aria-label="Student name" />
                    <button id="add-student-button" type="submit" class="btn btn-primary btn-icon" aria-label="Add student">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </form>

                <p class="sidebar-hint">Drag a name onto a seat</p>
                <div id="students" class="student-list"></div>

                <div class="student-actions">
                    <button id="clear-students-button" class="btn" data-tip="Move every student back to the list">
                        Unseat all
                    </button>
                    <button id="clear-button" class="btn btn-danger" data-tip="Remove every seat and unseat every student">
                        Clear all
                    </button>
                </div>

                <details class="shortcuts">
                    <summary>Shortcuts</summary>
                    <dl>
                        <dt><kbd>ctrl</kbd> + click</dt><dd>Add a seat</dd>
                        <dt>Drag empty space</dt><dd>Select seats</dd>
                        <dt><kbd>shift</kbd> + drag</dt><dd>Pan (or middle mouse)</dd>
                        <dt>Scroll</dt><dd>Pan</dd>
                        <dt><kbd>ctrl</kbd> + scroll</dt><dd>Zoom</dd>
                        <dt><kbd>w</kbd><kbd>a</kbd><kbd>s</kbd><kbd>d</kbd></dt><dd>Nudge the view</dd>
                        <dt><kbd>del</kbd></dt><dd>Delete selection or seat</dd>
                        <dt><kbd>ctrl</kbd> + <kbd>c</kbd> / <kbd>v</kbd></dt><dd>Copy, paste seats</dd>
                        <dt><kbd>ctrl</kbd> + <kbd>z</kbd> / <kbd>y</kbd></dt><dd>Undo, redo</dd>
                    </dl>
                </details>
            </aside>

            <main class="stage">
                <div id="container" class="chart">
                    <canvas id="grid-dots"></canvas>
                </div>
                <div class="zoom">
                    <button id="zoom-out" class="btn btn-quiet btn-icon" aria-label="Zoom out" data-tip="Zoom out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M5 12h14"/></svg>
                    </button>
                    <output id="zoom-display">100%</output>
                    <button id="zoom-in" class="btn btn-quiet btn-icon" aria-label="Zoom in" data-tip="Zoom in">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button id="zoom-fit" class="btn btn-quiet btn-icon" aria-label="Fit to seats" data-tip="Fit to seats">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                </div>
            </main>
        </div>
    </body>
</html>
